[project]
name = "TaMtD"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "EgeEken", email = "egeeken.tr@gmail.com"},
]
dependencies = ["transformers>=5.3.0", "torch>=2.7.1", "pillow>=12.1.1", "datasets>=4.7.0", "matplotlib>=3.10.8", "mlflow>=3.10.1", "numpy>=2.4.3", "opencv-python>=4.13.0.92", "decord2>=3.2.0"]
requires-python = "==3.12.*"
readme = "README.md"
license = {text = "MIT"}

[tool.pdm.scripts]
load-dataset = "python -m scripts.dataset_loader_example"

[tool.pdm]
distribution = false