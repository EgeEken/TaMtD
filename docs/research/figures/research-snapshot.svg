e="18" font-weight="400" text-anchor="start" >PBC STORE → LZMA · pixel-identical</text><rect x="1039" y="219" width="466" height="270" rx="21" fill="#101E34" stroke="#30415C" stroke-width="1"/><text x="1070" y="297" fill="#84ACFF" font-size="55" font-weight="800" text-anchor="start" >68–72%</text><text x="1070" y="357" fill="#EFF5FF" font-size="22" font-weight="700" text-anchor="start" >Intermediate representation utility</text><text x="1070" y="399" fill="#A4B5CC" font-size="18" font-weight="400" text-anchor="start" >WebP / AVIF as fraction of RGB U-probe</text><line x1="62" y1="523" x2="1498" y2="523" stroke="#30415C" stroke-width="1" /><text x="64" y="557" fill="#A4B5CC" font-size="16" font-weight="400" text-anchor="start" >Association ≠ causation. Staged decoding shows semantics before RGB, not yet cheaper end-to-end processing.</text><text x="1496" y="557" fill="#A4B5CC" font-size="16" font-weight="500" text-anchor="end" >EgeEken / TaMtD  ·  Phases 2–4.8</text></svg>