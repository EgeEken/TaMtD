<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040" role="img" aria-label="An exact-information control: PBC STORE vs LZMA"><defs><linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111E33"/><stop offset="100%" stop-color="#071222"/></linearGradient><filter id="soft"><feDropShadow dx="0" dy="5" stdDeviation="12" flood-color="#030916" flood-opacity=".20"/></filter></defs><rect x="0" y="0" width="1500" height="1040" rx="0" fill="url(#sky)" stroke="none" stroke-width="1"/><rect x="0" y="0" width="9" height="1040" rx="0" fill="#52E1C4" stroke="none" stroke-width="1"/><text x="62" y="52" fill="#52E1C4" font-size="17" font-weight="700" text-anchor="start" letter-spacing="3">TAMTD  /  RESEARCH ATLAS</text><text x="62" y="112" fill="#EFF5FF" font-size="43" font-weight="750" text-anchor="start" >An exact-information control: PBC STORE vs LZMA</text><text x="63" y="152" fill="#A4B5CC" font-size="20" font-weight="400" text-anchor="start" >The decoded pixels are identical. Only the secondary entropy wrapper changes.</text><line x1="62" y1="176" x2="1438" y2="176" stroke="#30415C" stroke-width="1" /><rect x="125" y="245" width="410" height="620" rx="24" fill="#101E34" stroke="#30415C" stroke-width="1"/><text x="154" y="296" fill="#EFF5FF" font-size="23" font-weight="750" text-anchor="start" >COMPRESSION</text><text x="154" y="336" fill="#52E1C4" font-size="21" font-weight="650" text-anchor="start" >LZMA saves 25.4% storage</text><text x="154" y="392" fill="#A4B5CC" font-size="19" font-weight="400" text-anchor="start" >Raw classification accuracy</text><rect x="219" y="495.2885586223166" width="88" height="163.7114413776834" rx="10" fill="#FFBA73" stroke="none" stroke-width="1"/><rect x="353" y="568.9606510969568" width="88" height="90.03934890304318" rx="10" fill="#C4A0F6" stroke="none" stroke-width="1"/><text x="263" y="480.2885586223166" fill="#FFBA73" font-size="22" font-weight="750" text-anchor="middle" >35.8%</text><text x="397" y="553.9606510969568" fill="#C4A0F6" font-size="22" font-weight="750" text-anchor="middle" >19.7%</text><text x="263" y="694" fill="#EFF5FF" font-size="17" font-weight="600" text-anchor="middle" >STORE</text><text x="397" y="694" fill="#EFF5FF" font-size="17" font-weight="600" text-anchor="middle" >LZMA</text><line x1="154" y1="724" x2="506" y2="724" stroke="#30415C" stroke-width="1" /><text x="154" y="763" fill="#FF819A" font-size="19" font-weight="700" text-anchor="start" >Accuracy penalty: 16.1 pp</text><text x="154" y="800" fill="#A4B5CC" font-size="17" font-weight="400" text-anchor="start" >U-probe: 0.655 → 0.194 bits</text><rect x="555" y="245" width="410" height="620" rx="24" fill="#101E34" stroke="#30415C" stroke-width="1"/><text x="584" y="296" fill="#EFF5FF" font-size="23" font-weight="750" text-anchor="start" >BALANCED</text><text x="584" y="336" fill="#52E1C4" font-size="21" font-weight="650" text-anchor="start" >LZMA saves 35.9% storage</text><text x="584" y="392" fill="#A4B5CC" font-size="19" font-weight="400" text-anchor="start" >Raw classification accuracy</text><rect x="649" y="480.16536919084695" width="88" height="178.83463080915308" rx="10" fill="#FFBA73" stroke="none" stroke-width="1"/><rect x="783" y="574.4811983958481" width="88" height="84.51880160415193" rx="10" fill="#C4A0F6" stroke="none" stroke-width="1"/><text x="693" y="465.16536919084695" fill="#FFBA73" font-size="22" font-weight="750" text-anchor="middle" >39.1%</text><text x="827" y="559.4811983958481" fill="#C4A0F6" font-size="22" font-weight="750" text-anchor="middle" >18.5%</text><text x="693" y="694" fill="#EFF5FF" font-size="17" font-weight="600" text-anchor="middle" >STORE</text><text x="827" y="694" fill="#EFF5FF" font-size="17" font-weight="600" text-anchor="middle" >LZMA</text><line x1="584" y1="724" x2="936" y2="724" stroke="#30415C" stroke-width="1" /><text x="584" y="763" fill="#FF819A" font-size="19" font-weight="700" text-anchor="start" >Accuracy penalty: 20.6 pp</text><text x="584" y="800" fill="#A4B5CC" font-size="17" font-weight="400" text-anchor="start" >U-probe: 0.785 → 0.152 bits</text><rect x="985" y="245" width="410" height="620" rx="24" fill="#101E34" stroke="#30415C" stroke-width="1"/><text x="1014" y="296" fill="#EFF5FF" font-size="23" font-weight="750" text-anchor="start" >QUALITY</text><text x="1014" y="336" fill="#52E1C4" font-size="21" font-weight="650" text-anchor="start" >LZMA saves 39.1% storage</text><text x="1014" y="392" fill="#A4B5CC" font-size="19" font-weight="400" text-anchor="start" >Raw classification accuracy</text><rect x="1079" y="478.532531257372" width="88" height="180.467468742628" rx="10" fill="#FFBA73" stroke="none" stroke-width="1"/><rect x="1213" y="582.8786506251474" width="88" height="76.12134937485257" rx="10" fill="#C4A0F6" stroke="none" stroke-width="1"/><text x="1123" y="463.532531257372" fill="#FFBA73" font-size="22" font-weight="750" text-anchor="middle" >39.4%</text><text x="1257" y="567.8786506251474" fill="#C4A0F6" font-size="22" font-weight="750" text-anchor="middle" >16.6%</text><text x="1123" y="694" fill="#EFF5FF" font-size="17" font-weight="600" text-anchor="middle" >STORE</text><text x="1257" y="694" fill="#EFF5FF" font-size="17" font-weight="600" text-anchor="middle" >LZMA</text><line x1="1014" y1="724" x2="1366" y2="724" stroke="#30415C" stroke-width="1" /><text x="1014" y="763" fill="#FF819A" font-size="19" font-weight="700" text-anchor="start" >Accuracy penalty: 22.8 pp</text><text x="1014" y="800" fill="#A4B5CC" font-size="17" font-weight="400" text-anchor="start" >U-probe: 0.758 → 0.112 bits</text><text x="126" y="944" fill="#52E1C4" font-size="23" font-weight="650" text-anchor="start" >Same image · same reconstructed pixels · different byte distributions</text><line x1="62" y1="973" x2="1438" y2="973" stroke="#30415C" stroke-width="1" /><text x="64" y="1007" fill="#A4B5CC" font-size="16" font-weight="400" text-anchor="start" >PBC three-seed mean; STORE and LZMA are alternative encodings, not successive decode stages.</text><text x="1436" y="1007" fill="#A4B5CC" font-size="16" font-weight="500" text-anchor="end" >EgeEken / TaMtD  ·  Phases 2–4.8</text></svg>